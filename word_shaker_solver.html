<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Shaker Solver</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #2a2d3a;
    --accent:    #7c6af7;
    --accent2:   #4ecdc4;
    --text:      #e8e9f0;
    --muted:     #6b6f84;
    --tile-bg:   #22253a;
    --tile-hover:#2d3150;
    --tile-active:#7c6af7;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }

  .tab-btn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.5rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent), #9b8df7);
    color: #fff;
    border: none;
  }

  .hidden {
    display: none;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--muted);
    margin-top: 0.4rem;
    font-size: 0.9rem;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .controls label {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .controls select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .grid-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  #board {
    display: grid;
    gap: 6px;
    /* grid-template-columns set by JS */
  }

  #board input {
    width: 48px;
    height: 48px;
    text-align: center;
    background: var(--tile-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    caret-color: var(--accent);
    transition: background 0.15s, border-color 0.15s;
    outline: none;
  }

  #board input:focus {
    background: var(--tile-hover);
    border-color: var(--accent);
  }

  #board input.filled {
    border-color: #3a3d55;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  button:active { transform: scale(0.97); }

  #solveBtn {
    background: linear-gradient(135deg, var(--accent), #9b8df7);
    color: #fff;
  }

  #clearBtn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  #pasteBtn {
    background: var(--surface);
    color: var(--accent2);
    border: 1px solid var(--border);
  }

  button:hover { opacity: 0.88; }

  .paste-hint {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  #quToggle {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  #quToggle.active {
    background: linear-gradient(135deg, var(--accent), #9b8df7);
    color: #fff;
    border: none;
  }

  #status {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.2em;
    margin-bottom: 1rem;
  }

  #status.running { color: var(--accent2); }
  #status.done    { color: var(--accent); }
  #status.error   { color: #f97068; }

  /* Results */
  #results { max-width: 860px; margin: 0 auto; }

  .summary-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  .summary-stat { text-align: center; }
  .summary-stat .val {
    font-family: 'Space Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .summary-stat .lbl {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.2rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  thead th {
    text-align: center;
    padding: 0.5rem 0.6rem;
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr:hover td { background: var(--tile-hover); }

  tbody td {
    padding: 0.45rem 0.6rem;
    text-align: center;
    border-bottom: 1px solid #1e2130;
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    transition: background 0.1s;
  }

  tbody td:first-child {
    text-align: left;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent2);
  }

  .cell-num { color: var(--text); }
  .cell-zero { color: var(--border); }
  .cell-high {
    background: rgba(124,106,247,0.15);
    color: var(--accent);
    font-weight: 700;
    border-radius: 4px;
  }

  .cell-revealed {
    background: rgba(78, 205, 196, 0.15);
    color: var(--accent2);
    border-radius: 4px;
  }

  .word-popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    max-width: 300px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 100;
  }

  .popup-header {
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .popup-words {
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
  }

  tfoot td {
    padding: 0.5rem 0.6rem;
    text-align: center;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    border-top: 2px solid var(--border);
  }

  tfoot td:first-child {
    text-align: left;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .min-len-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .min-len-row input[type=range] {
    accent-color: var(--accent);
    width: 120px;
  }

  .min-len-row span { color: var(--text); font-weight: 600; font-family: 'Space Mono', monospace; }

  footer {
    text-align: center;
    margin-top: 3rem;
    font-size: 0.75rem;
    color: #3a3d55;
  }

  /* Dictionary Tab */

  .dict-sticky {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 1rem 0;
    z-index: 10;
    max-width: 860px;
    margin: 0 auto;
  }

  .dict-input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }

  .dict-input-row input {
    flex: 1;
    background: var(--tile-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    padding: 0.5rem 0.75rem;
    outline: none;
  }

  .dict-input-row input:focus {
    border-color: var(--accent);
  }

  .dict-toggle-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .dict-action-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .dict-mode-btn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 1rem;
    font-size: 0.85rem;
  }

  .dict-mode-btn.active {
    background: linear-gradient(135deg, var(--accent), #9b8df7);
    color: #fff;
    border: none;
  }

  #dict-list {
    max-width: 860px;
    margin: 0 auto;
    padding-bottom: 2rem;
  }

  .dict-length-group {
    margin-bottom: 1.5rem;
  }

  .dict-length-header {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3rem;
    margin-bottom: 0.5rem;
  }

  .dict-word-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .dict-word {
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  .dict-word.valid {
    color: #4ecdc4;
    border-color: rgba(78,205,196,0.3);
    background: rgba(78,205,196,0.08);
  }

  .dict-word.invalid {
    color: #f97068;
    border-color: rgba(249,112,104,0.3);
    background: rgba(249,112,104,0.08);
  }
</style>
</head>
<body>

<header>
  <h1>Word Shaker Solver</h1>
  <p>Enter your board — get word counts by letter &amp; length, not the answers</p>
  <p id="dictProfile" style="font-size:0.75rem; color:var(--accent2); margin-top:0.3rem;"></p>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="solver">Solver</button>
  <button class="tab-btn" data-tab="dictionary">Dictionary</button>
</div>

<div class="tab-panel" id="tab-solver">
  <div class="controls">
    <label>Grid size
      <select id="sizeSelect">
        <option value="4">4 × 4</option>
        <option value="5">5 × 5</option>
        <option value="6">6 × 6</option>
        <option value="7">7 × 7</option>
        <option value="8" selected>8 × 8</option>
      </select>
    </label>
    <label>Min word length
      <select id="minLen">
        <option value="2">2+</option>
        <option value="3" selected>3+</option>
        <option value="4">4+</option>
        <option value="5">5+</option>
      </select>
    </label>
    <label>Starting letters amount
      <select id="fLettersLen">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>
    <button id="quToggle" class="active" title="Toggle Q tiles to be treated as QU when solving">Q = QU</button>
  </div>

  <div class="grid-wrapper">
    <div id="board"></div>
  </div>

  <div class="btn-row">
    <button id="pasteBtn" title="Paste 64 letters (left-to-right, top-to-bottom)">⌨ Paste letters</button>
    <button id="solveBtn">▶ Solve</button>
    <button id="clearBtn">✕ Clear</button>
  </div>

  <div class="paste-hint">Tip: click "Paste letters" and type/paste your board letters in one go (left→right, top→bottom, spaces optional)</div>

  <div id="status"></div>
  <div id="results"></div>

  <footer>Word Shaker Solver · runs entirely in your browser · no data sent anywhere</footer>
</div>

<div class="tab-panel hidden" id="tab-dictionary">
  <div class="dict-sticky">
    <div class="dict-input-row">
      <input type="text" id="dictInput" placeholder="Type a word to add..." autocomplete="off" spellcheck="false">
      <button id="dictAddBtn">Add</button>
    </div>
    <div class="dict-toggle-row">
      <button class="dict-mode-btn active" data-mode="validate" title="Click a word to make it valid">✓ Validate</button>
      <button class="dict-mode-btn" data-mode="invalidate" title="Click a word to make it invalid">✕ Invalidate</button>
      <button class="dict-mode-btn" data-mode="hide" title="Click a word to hide it from the list">○ Hide</button>
    </div>
    <div class="dict-action-row">
      <button id="dictClearBtn">Clear List</button>
      <button id="dictExportBtn">⬇ Export</button>
      <button id="dictImportBtn">⬆ Import</button>
    </div>
  </div>

  <div id="dict-list"></div>
</div>

<script>
// ─── Dictionary ──────────────────────────────────────────────────────────────
// We load the dictionary from an inline compressed word list.
// Using a broad English word list embedded as a Set for fast lookup.
// Words sourced from common Scrabble / Boggle dictionaries (TWL/SOWPODS subset).
// Due to file size constraints we use a fetch against a public word list.
// Falls back to a built-in ~5000 word starter set if offline.

let DICT = null;
let DICT_TRIE = null;

async function loadDictionary() {
  setStatus('Loading dictionary…', 'running');
  // Try to load a known public word list
  try {
    const r = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
    if (!r.ok) throw new Error('fetch failed');
    const text = await r.text();
    DICT = new Set(text.split('\n').map(w => w.trim().toLowerCase()).filter(w => w.length >= 2));
    buildTrie(DICT);
    setStatus(`Dictionary loaded (${DICT.size.toLocaleString()} words). Enter your board and solve!`, 'done');
  } catch(e) {
    DICT = new Set(FALLBACK_WORDS);
    buildTrie(DICT);
    setStatus(`Offline mode — using built-in dictionary (${DICT.size.toLocaleString()} words). Results may be limited.`, 'done');
  }
}

// Trie for fast prefix pruning
function buildTrie(words) {
  DICT_TRIE = Object.create(null);
  for (const w of words) {
    let node = DICT_TRIE;
    for (const ch of w) {
      if (!node[ch]) node[ch] = Object.create(null);
      node = node[ch];
    }
    node.$ = true;
  }
}

function trieHasPrefix(prefix) {
  let node = DICT_TRIE;
  for (const ch of prefix) {
    if (!node[ch]) return false;
    node = node[ch];
  }
  return true;
}

function trieIsWord(word) {
  let node = DICT_TRIE;
  for (const ch of word) {
    if (!node[ch]) return false;
    node = node[ch];
  }
  return !!node.$;
}

// ─── Board UI ────────────────────────────────────────────────────────────────
let gridSize = 8;

// Q tile toggle
let quMode = true;

// Store valid words to each cell
let wordLists = {};

function buildGrid() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${gridSize}, 48px)`;
  for (let i = 0; i < gridSize * gridSize; i++) {
    const inp = document.createElement('input');
    inp.maxLength = 2;
    inp.dataset.idx = i;
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.addEventListener('input', onTileInput);
    inp.addEventListener('keydown', onTileKey);
    board.appendChild(inp);
  }
}

function onTileInput(e) {
  const inp = e.target;
  const val = inp.value.replace(/[^a-zA-Z]/g, '').slice(-1).toUpperCase();
  inp.value = val;
  val ? inp.classList.add('filled') : inp.classList.remove('filled');
  if (val) {
    const next = inp.parentElement.querySelector(`[data-idx="${+inp.dataset.idx + 1}"]`);
    if (next) next.focus();
  }
}

function onTileKey(e) {
  const inp = e.target;
  const idx = +inp.dataset.idx;
  if (e.key === 'Backspace' && !inp.value) {
    const prev = inp.parentElement.querySelector(`[data-idx="${idx - 1}"]`);
    if (prev) { prev.value = ''; prev.classList.remove('filled'); prev.focus(); }
  }
  if (e.key === 'ArrowRight') { const n = inp.parentElement.querySelector(`[data-idx="${idx+1}"]`); if(n) n.focus(); }
  if (e.key === 'ArrowLeft')  { const n = inp.parentElement.querySelector(`[data-idx="${idx-1}"]`); if(n) n.focus(); }
  if (e.key === 'ArrowDown')  { const n = inp.parentElement.querySelector(`[data-idx="${idx+gridSize}"]`); if(n) n.focus(); }
  if (e.key === 'ArrowUp')    { const n = inp.parentElement.querySelector(`[data-idx="${idx-gridSize}"]`); if(n) n.focus(); }
}

// ─── Event Listeners ───────────────────────────────────────────────────────────
// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
  });
});


// Solver Event Listeners
// Grid size select
document.getElementById('sizeSelect').addEventListener('change', e => {
  gridSize = +e.target.value;
  buildGrid();
  document.getElementById('results').innerHTML = '';
  setStatus('');
});

// Board clear
document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('#board input').forEach(i => { i.value = ''; i.classList.remove('filled'); });
  document.getElementById('results').innerHTML = '';
  setStatus('');
});

// Board paste
document.getElementById('pasteBtn').addEventListener('click', () => {
  const raw = prompt(`Paste your ${gridSize*gridSize} board letters (spaces/commas ignored, left→right top→bottom):`);
  if (!raw) return;
  const letters = raw.replace(/[^a-zA-Z]/g, '').toUpperCase().split('');
  const inputs = document.querySelectorAll('#board input');
  inputs.forEach((inp, i) => {
    inp.value = letters[i] || '';
    inp.value ? inp.classList.add('filled') : inp.classList.remove('filled');
  });
});

// Q toggle
document.getElementById('quToggle').addEventListener('click', () => {
  quMode = !quMode;
  document.getElementById('quToggle').classList.toggle('active');
});

// Dictionary Event Listeners
// Mode button switching
document.querySelectorAll('.dict-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.dict-mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dictMode = btn.dataset.mode;
  });
});

// Word input bar
document.getElementById('dictAddBtn').addEventListener('click', () => {
  const input = document.getElementById('dictInput');
  dictAddWord(input.value);
  input.value = '';
  input.focus();
});

document.getElementById('dictInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('dictAddBtn').click();
});

// Click words in the list
document.getElementById('dict-list').addEventListener('click', e => {
  const word = e.target.dataset.word;
  if (!word) return;
  if (e.shiftKey) {
    dictWords[word] = 'hidden';
  } else if (dictMode === 'validate') {
    dictWords[word] = 'valid';
    customValid.add(word);
    customInvalid.delete(word);
  } else if (dictMode === 'invalidate') {
    dictWords[word] = 'invalid';
    customInvalid.add(word);
    customValid.delete(word);
  } else if (dictMode === 'hide') {
    dictWords[word] = 'hidden';
  }
  saveDictData();
  renderDictList();
});

// Right click to invalidate
document.getElementById('dict-list').addEventListener('contextmenu', e => {
  e.preventDefault();
  const word = e.target.dataset.word;
  if (!word) return;
  dictWords[word] = 'invalid';
  customInvalid.add(word);
  customValid.delete(word);
  saveDictData();
  renderDictList();
});

// Clear button
document.getElementById('dictClearBtn').addEventListener('click', () => {
  for (const word of Object.keys(dictWords)) dictWords[word] = 'hidden';
  saveDictData();
  renderDictList();
});

// Export dictionary
document.getElementById('dictExportBtn').addEventListener('click', () => {
  const lines = [
    '# Word Shaker Custom Dictionary',
    '# Lines starting with + are valid, - are invalid',
    '',
    ...([...customValid].sort().map(w => `+${w}`)),
    ...([...customInvalid].sort().map(w => `-${w}`))
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wordshaker-dictionary.txt';
  a.click();
  URL.revokeObjectURL(url);
});

// Import dictionary
document.getElementById('dictImportBtn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt';
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = ev.target.result.split('\n');
      customValid.clear();
      customInvalid.clear();
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('+')) customValid.add(trimmed.slice(1));
        if (trimmed.startsWith('-')) customInvalid.add(trimmed.slice(1));
      }
      // Update dictWords to match
      for (const w of customValid) {
        dictWords[w] = 'valid';
      }
      for (const w of customInvalid) {
        dictWords[w] = 'invalid';
      }
      saveDictData();
      renderDictList();
      document.getElementById('dictProfile').textContent = `📖 ${file.name}`;
    };
    reader.readAsText(file);
  });
  input.click();
});

// ─── Dictionary Editor ───────────────────────────────────────────────────────
let dictWords = {}; // { word: 'valid' | 'invalid' | 'hidden' }
let dictMode = 'validate';
let customValid = new Set(); // words added as valid
let customInvalid = new Set(); // words forced invalid

// Load from localStorage
function loadDictData() {
  try {
    const saved = localStorage.getItem('wordshaker-dict');
    if (saved) dictWords = JSON.parse(saved);
    const cv = localStorage.getItem('wordshaker-custom-valid');
    if (cv) customValid = new Set(JSON.parse(cv));
    const ci = localStorage.getItem('wordshaker-custom-invalid');
    if (ci) customInvalid = new Set(JSON.parse(ci));
  } catch(e) {}
}

// Save to localStorage
function saveDictData() {
  localStorage.setItem('wordshaker-dict', JSON.stringify(dictWords));
  localStorage.setItem('wordshaker-custom-valid', JSON.stringify([...customValid]));
  localStorage.setItem('wordshaker-custom-invalid', JSON.stringify([...customInvalid]));
}

// Add a word to the dict list
function dictAddWord(word, skipRender = false) {
  word = word.toLowerCase().trim();
  if (!word || word.length < 2) return;
  if (dictWords[word] === undefined) {
    dictWords[word] = trieIsWord(word) ? 'valid' : 'invalid';
  }
  saveDictData();
  if (!skipRender) renderDictList();
}

// Render the word list grouped by length
function renderDictList() {
  const visible = Object.entries(dictWords).filter(([w, s]) => s !== 'hidden');
  if (!visible.length) {
    document.getElementById('dict-list').innerHTML = '<p style="text-align:center;color:var(--muted);margin-top:2rem;">No words yet — type a word above or solve a board!</p>';
    return;
  }

  // Group by length
  const groups = {};
  for (const [word, status] of visible) {
    const len = word.length;
    if (!groups[len]) groups[len] = [];
    groups[len].push({ word, status });
  }

  // Sort each group alphabetically
  for (const len of Object.keys(groups)) {
    groups[len].sort((a, b) => a.word.localeCompare(b.word));
  }

  // Build HTML
  let html = '';
  for (const len of Object.keys(groups).sort((a,b) => +a - +b)) {
    html += `<div class="dict-length-group">
      <div class="dict-length-header">${len} letter words (${groups[len].length})</div>
      <div class="dict-word-list">`;
        for (const { word, status } of groups[len]) {
          html += `<span class="dict-word ${status}" data-word="${word}">${word.toUpperCase()}</span>`;
        }
        html += `</div></div>`;
  }
  document.getElementById('dict-list').innerHTML = html;
}

// ─── Solver ──────────────────────────────────────────────────────────────────
function getBoard() {
  return Array.from(document.querySelectorAll('#board input')).map(i => i.value.toLowerCase());
}

function neighbours(idx, size) {
  const row = Math.floor(idx / size), col = idx % size;
  const result = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (dr === 0 && dc === 0) continue;
    const r = row + dr, c = col + dc;
    if (r >= 0 && r < size && c >= 0 && c < size) result.push(r * size + c);
  }
  return result;
}

function solve(board, size, minLen) {
  const found = new Set();
  const NEIGH = Array.from({length: size*size}, (_, i) => neighbours(i, size));

  function dfs(idx, path, word, node) {
    const ch = (board[idx] === 'q' && quMode) ? 'qu' : board[idx];
    
    // Walk trie - handle 'qu' as two steps
    let newNode = node;
    for (const letter of ch) {
      if (!newNode[letter]) return;
      newNode = newNode[letter];
    }

    const newWord = word + ch;
    const newPath = path | (1 << idx);

    if (newWord.length >= minLen && newNode.$) found.add(newWord);
    if (newWord.length < size * 2) { // reasonable max
      for (const nidx of NEIGH[idx]) {
        if (!(newPath & (1 << nidx))) {
          dfs(nidx, newPath, newWord, newNode);
        }
      }
    }
  }

  // For large boards (>4) use BigInt paths to avoid bit overflow
  // Actually for 8x8=64 cells we need BigInt
  const useBigInt = size * size > 30;

  function dfsB(idx, path, word, node) {
    const ch = (board[idx] === 'q' && quMode) ? 'qu' : board[idx];

    // Walk trie - handle 'qu' as two steps
    let newNode = node;
    for (const letter of ch) {
      if (!newNode[letter]) return;
      newNode = newNode[letter];
    }

    const newWord = word + ch;
    const newPath = path | (1n << BigInt(idx));

    if (newWord.length >= minLen && newNode.$) found.add(newWord);
    if (newWord.length < 15) {
      for (const nidx of NEIGH[idx]) {
        if (!(newPath & (1n << BigInt(nidx)))) {
          dfsB(nidx, newPath, newWord, newNode);
        }
      }
    }
  }

  for (let i = 0; i < size * size; i++) {
    if (useBigInt) dfsB(i, 0n, '', DICT_TRIE);
    else dfs(i, 0, '', DICT_TRIE);
  }

  return [...found];
}

function setStatus(msg, cls = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

document.getElementById('solveBtn').addEventListener('click', async () => {
  if (!DICT) { setStatus('Dictionary still loading, please wait…', 'error'); return; }
  const board = getBoard();
  const fLettersLen = +document.getElementById('fLettersLen').value;
  const minLen = +document.getElementById('minLen').value;
  const missing = board.filter(c => !c).length;
  if (missing > 0) { setStatus(`Board is incomplete — ${missing} cells empty.`, 'error'); return; }

  setStatus('Solving…', 'running');
  document.getElementById('results').innerHTML = '';

  // Yield to browser paint
  await new Promise(r => setTimeout(r, 20));

  const words = solve(board, gridSize, minLen);

  if (!words.length) {
    setStatus('No words found. Check your board is filled in correctly.', 'error');
    return;
  }

  renderResults(words, minLen, fLettersLen);

  // Show solved board word results in dictionary list
  for (const w of words) {
    dictAddWord(w, true);
  }
  renderDictList();

  setStatus(`Found ${words.length} words. Good luck! 🎯`, 'done');
});

// Show word popup for clicked cell
function showWordPopup(cell, prefix, len, cellWords) {
  // Remove any existing popup
  document.querySelector('.word-popup')?.remove();

  // Create popup element
  const popup = document.createElement('div');
  popup.className = 'word-popup';
  popup.innerHTML = `
    <div class="popup-header">${prefix.toUpperCase()} · ${len} letters</div>
    <div class="popup-words">${cellWords.map(w => w.toUpperCase()).join(', ')}</div>
  `;
  
  // Position it below the clicked cell
  document.body.appendChild(popup);
  const rect = cell.getBoundingClientRect();
  popup.style.left = `${rect.left + window.scrollX}px`;
  popup.style.top = `${rect.bottom + window.scrollY + 6}px`;

  // Close when clicking outside
  setTimeout(() => {
    document.addEventListener('click', e => {
      if (!popup.contains(e.target)) popup.remove();
    }, {once: true});
  }, 0);
}

// Reaveal words on cell click
document.getElementById('results').addEventListener('click', e => {
  const cell = e.target.closest('.cell-clickable');
  if (!cell) return;

  const prefix = cell.dataset.prefix;
  const len = cell.dataset.len === '9+' ? '9+' : +cell.dataset.len;
  const cellWords = wordLists[prefix][len] || [];

  // Show Popup
  showWordPopup(cell, prefix, len, cellWords);

  // Highlight cell
  cell.classList.add('cell-revealed');
});

// Unhighlight cell on hold click
document.getElementById('results').addEventListener('mousedown', e => {
  const cell = e.target.closest('.cell-clickable');
  if (!cell) return;
  let held = false;
  let timer = setTimeout(() => {
    held = true;
    cell.classList.remove('cell-revealed');
  }, 500);
  document.addEventListener('mouseup', () => clearTimeout(timer), {once:true});
  cell.addEventListener('click', e => {
    if (held) e.stopPropagation();
  }, {once: true});
});

function renderResults(words, minLen, prefixLen) {
  // Find max length
  const maxLen = Math.max(...words.map(w => w.length));
  const lengths = Array.from({length: maxLen - minLen + 1}, (_, i) => i + minLen);

  // Create set of words by first 1-3 letters
  const fLetters = new Set();
  const f2Letters = new Set();
  const f3Letters = new Set();
  for (const w of words) {
    fLetters.add(w.slice(0, 1));
    f2Letters.add(w.slice(0, 2));
    f3Letters.add(w.slice(0, 3));
  }

  // Check Starting Letter Amount option
  let activeSet;
  if (prefixLen === 1) activeSet = fLetters;
  else if (prefixLen === 2) activeSet = f2Letters;
  else if (prefixLen === 3) activeSet = f3Letters;  

  // Build counts keyed by starting letter sets and length
  const counts = {};
  for (const l of activeSet) {
    counts[l] = {};
    for (const len of lengths) counts[l][len] = 0;
  }

  // Store valid words to each cell
  wordLists = {};
  for (const l of activeSet) {
    wordLists[l] = {};
    for (const len of lengths) wordLists[l][len] = [];
  }

  // Count words
  for (const w of words) {
    const l = w.slice(0, prefixLen);
    if (counts[l] && counts[l][w.length] !== undefined) {
      counts[l][w.length]++;
      wordLists[l][w.length].push(w);
    }
  }

  // Filter to letters that have at least one word
  const usedLetters = activeSet;

  // Column totals
  const colTotals = {};
  for (const len of lengths) colTotals[len] = Array.from(usedLetters).reduce((s, l) => s + (counts[l][len] || 0), 0);
  const grandTotal = words.length;

  // Max count for highlighting
  const allCounts = Array.from(usedLetters).flatMap(l => lengths.map(len => counts[l][len]));
  const maxCount = Math.max(...allCounts);
  const thresh = Math.max(3, Math.floor(maxCount * 0.6));

  // Group lengths into bands for the table header
  // Show individual columns up to length 8, then "9+" combined
  const showLengths = lengths.filter(l => l <= 8);
  const hasLong = lengths.some(l => l > 8);

  // Summary stats
  const longestWord = words.reduce((a, b) => a.length >= b.length ? a : b, '');

  let html = `
  <div class="summary-bar">
    <div class="summary-stat"><div class="val">${grandTotal}</div><div class="lbl">Total words</div></div>
    <div class="summary-stat"><div class="val">${usedLetters.size}</div><div class="lbl">Starting letters</div></div>
    <div class="summary-stat"><div class="val">${longestWord.length}</div><div class="lbl">Longest (${longestWord.length} letters)</div></div>
    <div class="summary-stat"><div class="val">${words.filter(w=>w.length>=6).length}</div><div class="lbl">6+ letter words</div></div>
  </div>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Letter</th>
        ${showLengths.map(l => `<th>${l}L</th>`).join('')}
        ${hasLong ? '<th>9+L</th>' : ''}
        <th>Total</th>
      </tr>
    </thead>
    <tbody>`;

  for (const l of usedLetters) {
    const rowTotal = Object.values(counts[l]).reduce((a,b)=>a+b,0);
    html += `<tr><td>${l.toUpperCase()}</td>`;
    for (const len of showLengths) {
      const v = counts[l][len] || 0;
      if (v === 0) html += `<td class="cell-zero">—</td>`;
      else if (v >= thresh) html += `<td class="cell-high cell-clickable" data-prefix="${l}" data-len="${len}">${v}</td>`;
      else html += `<td class="cell-num cell-clickable" data-prefix="${l}" data-len="${len}">${v}</td>`;
    }
    if (hasLong) {
      const longCount = lengths.filter(len=>len>8).reduce((s,len)=>s+(counts[l][len]||0),0);
      const longWords = lengths.filter(len=>len>8).flatMap(len => wordLists[l][len] || []);
      wordLists[l]['9+'] = longWords;
      html += longCount ? `<td class="cell-num cell-clickable" data-prefix="${l}" data-len="9+">${longCount}</td>` : `<td class="cell-zero">—</td>`;
    }
    html += `<td class="cell-num" style="color:var(--accent2)">${rowTotal}</td></tr>`;
  }

  html += `</tbody><tfoot><tr><td>Totals</td>`;
  for (const len of showLengths) {
    html += `<td>${colTotals[len] || 0}</td>`;
  }
  if (hasLong) {
    const longTotal = lengths.filter(l=>l>8).reduce((s,len)=>s+(colTotals[len]||0),0);
    html += `<td>${longTotal}</td>`;
  }
  html += `<td>${grandTotal}</td></tr></tfoot></table></div>`;

  document.getElementById('results').innerHTML = html;
}
